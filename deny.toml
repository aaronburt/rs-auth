[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
unmaintained = "all"
ignore = [
    { id = "RUSTSEC-2026-0374", reason = "basic-toml is unmaintained; build-time only, via askama" },
]

[licenses]
version = 2
confidence-threshold = 0.9
private = { ignore = true }
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    { crate = "openssl", reason = "rs-auth uses pure-Rust crypto only" },
    { crate = "openssl-sys", reason = "rs-auth uses pure-Rust crypto only" },
    { crate = "rsa", reason = "only HS256 is supported" },
    { crate = "ring", reason = "keep one crypto stack" },
    { crate = "aws-lc-rs", reason = "keep one crypto stack" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
