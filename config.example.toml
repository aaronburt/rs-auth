# rs-auth configuration. Validate with: rs-auth check-config --config config.toml
# Keep this file private: chmod 600 config.toml

[server]
address = "0.0.0.0:9091"
# Public URL of the portal itself, used for redirects. Must be the root of
# its own host, and inside session.domain.
portal_url = "https://auth.example.com"
# Only these addresses may call /api/verify or set X-Forwarded-* headers.
# List only your proxy's own fixed address, never a network that apps share.
trusted_proxies = ["172.30.1.10/32"]
# Where to land after signing in when no app asked for sign-in.
# Default: a small "You're signed in" page on the portal.
# default_redirect_url = "https://home.example.com"
# Development only: allow http and drop the Secure cookie flag.
# insecure_dev_mode = false

[session]
# Cookie is set on this domain so every subdomain shares it. The browser sends
# it to every host under this domain, so they must all be equally trusted.
domain = "example.com"
cookie_name = "rs_auth_session"
version = 1                 # bump to log everyone out
expiry = "12h"              # 30m, 12h, 7d ...
# Secret: first found of jwt_secret_file, the RS_AUTH_JWT_SECRET env var,
# then jwt_secret. At least 32 bytes. Make one with: openssl rand -hex 32
jwt_secret_file = "/run/secrets/rs_auth_jwt"
# jwt_secret = "..."        # allowed, but warns at startup
# Signed-out sessions are remembered here so a copied cookie stops working
# even after a restart. Must be writable: rs-auth will not start otherwise, and
# a sign-out that can't be saved answers 503 so it can be retried. In Docker,
# mount a volume at /data. Without it, the list is kept in memory and is lost
# on restart. Each rs-auth instance keeps its own list, so run only one.
# Changing a user's password also ends that user's existing sessions.
# revocation_file = "/data/revoked.txt"

[login]
# Failed sign-ins per username, from any address, within this sliding window.
# Once reached, that account refuses every sign-in, even with the right
# password, until the oldest failure leaves the window. Anyone who knows a
# username can use this to keep that account locked out, so pick the number
# with that in mind. Throttling by address is left to your proxy or firewall.
max_attempts = 5
window = "5m"

# Which groups may open each host. A host with no entry gets 403 for everyone.
# A user needs any one of the listed groups. "*.lab.example.com" covers every
# subdomain of lab.example.com (not lab.example.com itself); an exact host
# beats a wildcard.
[access."grafana.example.com"]
groups = ["admins"]

[access."photos.example.com"]
groups = ["family", "admins"]

# One table per user; the name after "users." is the username.
# Hashes go in single quotes (a TOML literal string), so nothing in them
# is read as an escape.
[users.aaron]
display_name = "Aaron"
email = "aaron@example.com"
groups = ["admins"]
# Generated with: rs-auth hash-password
password = '$argon2id$v=19$m=65536,t=3,p=4$REPLACE_ME'
# Optional authenticator-app code (TOTP). Generated with: rs-auth totp-secret aaron
# totp_secret = "BASE32SECRET"

[users.guest]
display_name = "Guest"
groups = ["family"]
password = '$argon2id$v=19$m=65536,t=3,p=4$REPLACE_ME'
