# rs-auth configuration. Validate with: rs-auth check-config --config config.toml
# Keep this file private: chmod 600 config.toml

[server]
address = "0.0.0.0:9091"
# Public URL of the portal itself, used for redirects. Must be the root of
# its own host, and inside session.domain.
portal_url = "https://auth.example.com"
# Only these addresses may call /api/verify or set X-Forwarded-* headers.
# Use your proxy's address or its Docker network.
trusted_proxies = ["172.18.0.0/16"]
# Where to land after signing in when no app asked for sign-in.
# Default: a small "You're signed in" page on the portal.
# default_redirect_url = "https://home.example.com"
# Development only: allow http and drop the Secure cookie flag.
# insecure_dev_mode = false

[session]
# Cookie is set on this domain so every subdomain shares it.
domain = "example.com"
cookie_name = "rs_auth_session"
version = 1                 # bump to log everyone out
expiry = "12h"              # 30m, 12h, 7d ...
# Secret: first found of jwt_secret_file, the RS_AUTH_JWT_SECRET env var,
# then jwt_secret. At least 32 bytes. Make one with: openssl rand -hex 32
jwt_secret_file = "/run/secrets/rs_auth_jwt"
# jwt_secret = "..."        # allowed, but warns at startup
# Signed-out sessions are remembered here so a copied cookie stops working
# even after a restart. Must be writable (in Docker, put it on a volume).
# Without it, the list is kept in memory and is lost on restart.
# Changing a user's password also ends that user's existing sessions.
# revocation_file = "/data/revoked.txt"

[login]
max_attempts = 5            # failed sign-ins per client IP ...
window = "5m"               # ... within this sliding window

# One table per user; the name after "users." is the username.
# Hashes go in single quotes (a TOML literal string), so nothing in them
# is read as an escape.
[users.aaron]
display_name = "Aaron"
email = "aaron@example.com"
groups = ["admins"]
# Generated with: rs-auth hash-password
password = '$argon2id$v=19$m=65536,t=3,p=4$REPLACE_ME'

[users.guest]
display_name = "Guest"
groups = ["family"]
password = '$argon2id$v=19$m=65536,t=3,p=4$REPLACE_ME'
