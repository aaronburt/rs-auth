# A demo to try in your browser. No hosts-file changes needed: *.localhost
# always points at your own machine.
#
#   docker compose -f examples/demo/docker-compose.yml up -d --build
#   open https://whoami.rs-auth.localhost:8443  (accept the self-signed certificate)
#   docker compose -f examples/demo/docker-compose.yml down
#
# Users: aaron / aaron-test-pass, guest / guest-test-pass
# other.rs-auth.localhost is admins-only: sign in as guest there to see the 403 page.
name: rs-auth-demo

networks:
  edge:
  auth:
    internal: true
    ipam:
      config:
        - subnet: 172.29.1.0/24
  apps:
    internal: true

volumes:
  rs_auth_data:

services:
  traefik:
    image: traefik:v3.7.19
    command:
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.aliasHeadersStrategy=delete
      - --entrypoints.websecure.http.maxHeaderBytes=32768
      - --entrypoints.websecure.http.middlewares=client-limit@file
      - --entrypoints.websecure.transport.respondingTimeouts.readTimeout=10s
      - --entrypoints.websecure.transport.respondingTimeouts.idleTimeout=60s
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --log.level=WARN
    volumes:
      - ./traefik-dynamic.yml:/etc/traefik/dynamic.yml:ro
    ports:
      - "127.0.0.1:8443:443"
    networks:
      edge:
      auth:
        ipv4_address: 172.29.1.10
      apps:

  rs-auth:
    build: ../..
    environment:
      RS_AUTH_JWT_SECRET: demo-only-secret-demo-only-secret-demo-only
      RUST_LOG: info
    volumes:
      - ./config.toml:/config/config.toml:ro
      - rs_auth_data:/data
    networks: [auth]

  whoami:
    image: traefik/whoami:v1.10
    networks: [apps]
