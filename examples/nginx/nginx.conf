# rs-auth with nginx. nginx must be built with ngx_http_auth_request_module
# (the official images are). server.trusted_proxies in config.toml must list
# only nginx's own address on the network it shares with rs-auth.
worker_processes auto;
error_log /dev/stderr warn;

events {
	worker_connections 1024;
}

http {
	access_log /dev/stdout;
	server_tokens off;

	# Docker's DNS, so rs-auth is looked up again if its container is replaced.
	# Headers with underscores, such as Remote_User, are dropped by default
	# (underscores_in_headers off); leave it that way.
	resolver 127.0.0.11 valid=10s ipv6=off;

	client_header_timeout 10s;
	client_body_timeout 30s;
	keepalive_timeout 60s;
	large_client_header_buffers 4 8k;
	limit_conn_zone $binary_remote_addr zone=per_ip:10m;
	limit_conn per_ip 64;

	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_certificate /etc/nginx/certs/fullchain.pem;
	ssl_certificate_key /etc/nginx/certs/privkey.pem;

	server {
		listen 80 default_server;
		return 301 https://$host$request_uri;
	}

	# The portal itself. /api/verify is only for nginx's own internal calls.
	server {
		listen 443 ssl;
		http2 on;
		server_name auth.example.com;
		set $rs_auth http://rs-auth:9091;

		location ^~ /api/verify {
			return 404;
		}
		location / {
			proxy_pass $rs_auth;
			proxy_set_header Host $http_host;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header X-Forwarded-For $remote_addr;
		}
	}

	# A protected app. Repeat for each app.
	server {
		listen 443 ssl;
		http2 on;
		server_name whoami.example.com;
		set $rs_auth http://rs-auth:9091;
		include /etc/nginx/rs-auth-server.conf;

		location / {
			include /etc/nginx/rs-auth.conf;
			proxy_pass http://whoami:80;
			proxy_set_header Host $http_host;
		}
	}
}
