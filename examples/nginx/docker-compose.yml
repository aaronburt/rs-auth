# rs-auth guarding a whoami app behind nginx (auth_request).
# 1. Put a config.toml next to this file (copy ../../config.example.toml) and set
#      [server] trusted_proxies = ["172.32.1.10/32"]
#      [session] revocation_file = "/data/revoked.txt"
#    172.32.1.10 is nginx's fixed address on the "auth" network below, and is
#    the only address rs-auth should trust.
# 2. openssl rand -hex 32 > jwt.secret
# 3. Put your certificate in ./certs/fullchain.pem and ./certs/privkey.pem
#    (the wildcard for your session domain covers the portal and every app).
# 4. docker compose up -d, then open https://whoami.example.com
#
# Only nginx is on "edge" and publishes ports. rs-auth and the apps sit on
# internal networks with no published ports, and apps cannot reach rs-auth.
# Run one rs-auth: each replica keeps its own sign-out list (see the README).
name: rs-auth-nginx

networks:
  edge:
  auth:
    internal: true
    ipam:
      config:
        - subnet: 172.32.1.0/24
  apps:
    internal: true
    ipam:
      config:
        - subnet: 172.32.2.0/24

secrets:
  rs_auth_jwt:
    file: ./jwt.secret

volumes:
  rs_auth_data:

services:
  nginx:
    image: nginx:1.30.8-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./rs-auth.conf:/etc/nginx/rs-auth.conf:ro
      - ./rs-auth-server.conf:/etc/nginx/rs-auth-server.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on: [whoami]
    networks:
      edge:
      auth:
        ipv4_address: 172.32.1.10
      apps:

  rs-auth:
    build: ../..
    volumes:
      - ./config.toml:/config/config.toml:ro
      - rs_auth_data:/data
    secrets: [rs_auth_jwt]
    networks: [auth]
    restart: unless-stopped

  whoami:
    image: traefik/whoami:v1.10
    networks: [apps]
