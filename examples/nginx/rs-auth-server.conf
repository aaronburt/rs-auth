# Include once in every server block that has a location protected by rs-auth,
# after `set $rs_auth http://rs-auth:9091;`. It adds the internal address nginx
# asks about each request. Nothing here is reachable from outside.

location = /_rs_auth {
	internal;
	proxy_pass $rs_auth/api/verify/nginx;
	proxy_method GET;
	proxy_pass_request_body off;
	proxy_set_header Content-Length "";
	proxy_set_header Connection "";
	proxy_http_version 1.1;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header X-Forwarded-Host $http_host;
	proxy_set_header X-Forwarded-Uri $request_uri;
}

location @rs_auth_login {
	if ($auth_login = "") { return 401; }
	if ($request_method ~ ^(GET|HEAD)$) { return 302 $auth_login; }
	return 303 $auth_login;
}
