# rs-auth guarding a whoami app behind Traefik v3, with the file provider (no
# Docker socket).
# 1. Put a config.toml next to this file (copy ../../config.example.toml) and set
#      [server] trusted_proxies = ["172.30.1.10/32"]
#      [session] revocation_file = "/data/revoked.txt"
#    172.30.1.10 is Traefik's fixed address on the "auth" network below, and is
#    the only address rs-auth should trust.
# 2. openssl rand -hex 32 > jwt.secret
# 3. docker compose up -d, then open https://whoami.example.com
#
# Only Traefik is on "edge" and publishes ports. rs-auth and the apps sit on
# internal networks with no published ports, and apps cannot reach rs-auth.
# Run one rs-auth: each replica keeps its own sign-out list (see the README).
name: rs-auth-traefik

networks:
  edge:
  auth:
    internal: true
    ipam:
      config:
        - subnet: 172.30.1.0/24
  apps:
    internal: true
    ipam:
      config:
        - subnet: 172.30.2.0/24

secrets:
  rs_auth_jwt:
    file: ./jwt.secret

volumes:
  rs_auth_data:

services:
  traefik:
    image: traefik:v3.7.19
    command:
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.aliasHeadersStrategy=delete
      - --entrypoints.websecure.http.maxHeaderBytes=32768
      - --entrypoints.websecure.http.middlewares=client-limit@file
      - --entrypoints.websecure.transport.respondingTimeouts.readTimeout=10s
      - --entrypoints.websecure.transport.respondingTimeouts.idleTimeout=60s
      - --entrypoints.web.transport.respondingTimeouts.readTimeout=10s
      # Use your own certificate resolver here (ACME, DNS challenge, ...).
    ports: ["80:80", "443:443"]
    volumes:
      - ./dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks:
      edge:
      auth:
        ipv4_address: 172.30.1.10
      apps:

  rs-auth:
    build: ../..
    volumes:
      - ./config.toml:/config/config.toml:ro
      - rs_auth_data:/data
    secrets: [rs_auth_jwt]
    networks: [auth]
    restart: unless-stopped

  whoami:
    image: traefik/whoami:v1.10
    networks: [apps]
