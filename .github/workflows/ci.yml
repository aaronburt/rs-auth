name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  e2e-traefik:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE: docker compose -f e2e/traefik/docker-compose.yml
    steps:
      - uses: actions/checkout@v4
      - name: Build the rs-auth image
        run: $COMPOSE build
      - name: Run end-to-end checks through Traefik
        run: $COMPOSE up --abort-on-container-exit --exit-code-from tester
      - name: Show container logs
        if: failure()
        run: $COMPOSE logs --no-color
      - name: Clean up
        if: always()
        run: $COMPOSE down -v

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
