# The same config after an admin changed aaron's password (now aaron-new-pass)
# and removed guest. A second rs-auth instance runs it to stand in for a
# restart with the edited file. Test-only. Do not reuse.
[server]
address = "0.0.0.0:9091"
portal_url = "https://auth.example.test"
# Only the proxy, at its fixed address on the auth network. The tester is deliberately NOT
# trusted, so it can check that direct calls to /api/verify are refused.
trusted_proxies = ["172.30.1.10/32"]

[session]
domain = "example.test"
expiry = "1h"
# The secret comes from RS_AUTH_JWT_SECRET in docker-compose.yml.

[login]
max_attempts = 5
window = "5m"

[access."changed.example.test"]
groups = ["family"]

[users.aaron]
display_name = "Aaron"
email = "aaron@example.test"
groups = ["admins", "family"]
