# Test-only config for the end-to-end environments. Do not reuse.
# Passwords: aaron / aaron-test-pass, guest / guest-test-pass, carol / carol-test-pass.
server:
  address: 0.0.0.0:9091
  portal_url: https://auth.example.test
  # Only the proxy container. The tester container is deliberately NOT
  # trusted, so it can check that direct calls to /api/verify are refused.
  trusted_proxies: [172.30.0.10/32]

session:
  domain: example.test
  expiry: 1h
  # The secret comes from RS_AUTH_JWT_SECRET in docker-compose.yml.

login:
  max_attempts: 5
  window: 5m

users:
  aaron:
    display_name: Aaron
    email: aaron@example.test
