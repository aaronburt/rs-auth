worker_processes 1;
error_log /dev/stderr warn;

events {
	worker_connections 1024;
}

http {
	access_log /dev/stdout;
	server_tokens off;
	resolver 127.0.0.11 valid=10s ipv6=off;

	client_header_timeout 10s;
	client_body_timeout 30s;
	keepalive_timeout 60s;
	large_client_header_buffers 4 8k;
	limit_conn_zone $binary_remote_addr zone=per_ip:10m;
	limit_conn per_ip 64;

	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_certificate /etc/nginx/certs/cert.pem;
	ssl_certificate_key /etc/nginx/certs/key.pem;

	server {
		listen 443 ssl;
		http2 on;
		server_name auth.example.test;
		set $rs_auth http://rs-auth:9091;

		location ^~ /api/verify {
			return 404;
		}
		location / {
			proxy_pass $rs_auth;
			proxy_set_header Host $http_host;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header X-Forwarded-For $remote_addr;
		}
	}

	server {
		listen 443 ssl;
		http2 on;
		server_name whoami.example.test other.example.test admins.example.test x.lab.example.test lab.example.test unlisted.example.test;
		set $rs_auth http://rs-auth:9091;
		include /etc/nginx/rs-auth-server.conf;

		location / {
			include /etc/nginx/rs-auth.conf;
			proxy_pass http://whoami:80;
			proxy_set_header Host $http_host;
		}
	}

	server {
		listen 443 ssl;
		http2 on;
		server_name changed.example.test;
		set $rs_auth http://rs-auth-changed:9091;
		include /etc/nginx/rs-auth-server.conf;

		location / {
			include /etc/nginx/rs-auth.conf;
			proxy_pass http://whoami:80;
			proxy_set_header Host $http_host;
		}
	}
}
