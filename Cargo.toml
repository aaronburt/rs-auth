[package]
name = "rs-auth"
version = "1.0.0"
description = "A small forward-auth login portal for Traefik and Caddy"
edition = "2024"
publish = false

[dependencies]
argon2 = "0.6.0"
askama = "0.16.1"
axum = "0.8"
getrandom = "0.4"
base64 = "0.23.1"
hmac = "0.13"
ipnet = "2.12.2"
jsonwebtoken = { version = "12.0.0", default-features = false }
rpassword = "7.5.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml_ng = "0.10"
sha2 = "0.11.1"
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "signal", "sync", "time", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt"] }
url = "2.5.8"

[dev-dependencies]
proptest = "1"
tokio = { version = "1.54.1", features = ["io-util"] }
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
unwrap_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
mem_forget = "deny"
string_slice = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Argon2 is painfully slow unoptimised; keep debug builds and tests quick.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
